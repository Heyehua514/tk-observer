name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TAURI_UPDATER_ENDPOINT: https://github.com/Heyehua514/tk-observer/releases/latest/download/latest.json
      TAURI_UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEVFMzE3QTA2NzAzNjY5REIKUldUYmFUWndCbm94N3U3TDJINGovM0NzZ0Q1R2tqNjJWV1daTUZDbkZxanNuV0lnRmRTTnFuaWsK
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release configuration
        run: node scripts/desktop/release-check.mjs
      - name: Configure release tag committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare release tag
        run: node scripts/desktop/prepare-release-tag.mjs

  release:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: ""
          - name: Windows
            os: windows-latest
            args: "--target x86_64-pc-windows-msvc"
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TAURI_UPDATER_ENDPOINT: https://github.com/Heyehua514/tk-observer/releases/latest/download/latest.json
      TAURI_UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEVFMzE3QTA2NzAzNjY5REIKUldUYmFUWndCbm94N3U3TDJINGovM0NzZ0Q1R2tqNjJWV1daTUZDbkZxanNuV0lnRmRTTnFuaWsK
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release configuration
        run: node scripts/desktop/release-check.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and publish desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: TK观察工作台 ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: Desktop release with signed updater artifacts.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: apps/desktop
          args: ${{ matrix.args }}
