<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态问候预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#111827;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:28px}.app{width:min(1180px,96vw);height:720px;background:#f8fafc;border:1px solid #dfe4ea;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:220px 1fr;box-shadow:0 24px 70px rgba(15,23,42,.12);position:relative}.sidebar{background:#fff;border-right:1px solid #e5e7eb;padding:22px 16px}.brand{font-size:17px;font-weight:700;margin-bottom:32px}.nav-label{font-size:12px;color:#94a3b8;padding:0 10px 8px}.nav-item{padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:3px}.nav-item.active{background:#f1f5f9;font-weight:600}.shell{min-width:0}.header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 24px;gap:14px}.menu{width:32px;height:32px;border:1px solid #d8dee8;border-radius:6px;display:grid;place-items:center;color:#64748b}.divider{width:1px;height:24px;background:#e5e7eb}.title{font-size:14px;font-weight:650}.tools{margin-left:auto;display:flex;gap:10px;align-items:center;color:#64748b}.search{border:1px solid #e5e7eb;border-radius:6px;padding:7px 12px;font-size:12px}.avatar{width:30px;height:30px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-size:12px;color:#334155}.content{padding:28px}.content h1{font-size:22px;margin:0}.content p{font-size:14px;color:#64748b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:7px;padding:18px}.card small{color:#64748b}.card strong{display:block;font-size:24px;margin-top:8px}.panel{height:260px;background:#fff;border:1px solid #e5e7eb;border-radius:7px;margin-top:16px;padding:18px}.greeting{position:absolute;z-index:20;top:82px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:11px;background:rgba(17,24,39,.96);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:13px 18px;box-shadow:0 16px 35px rgba(15,23,42,.25);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;font-weight:600;letter-spacing:0;animation:greeting 5s ease-in-out infinite}.sun{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f8c65a;color:#4b3710;font-size:15px}.sub{font-size:12px;font-weight:400;color:#cbd5e1;margin-top:2px}@keyframes greeting{0%{opacity:0;transform:translate(-50%,-18px) scale(.94)}10%{opacity:1;transform:translate(-50%,0) scale(1.02)}15%{transform:translate(-50%,0) scale(1)}72%{opacity:1;transform:translate(-50%,0) scale(1)}90%,100%{opacity:0;transform:translate(-50%,-8px) scale(.98)}}.note{position:absolute;left:238px;bottom:18px;color:#64748b;font-size:12px;background:#fff;border:1px solid #e5e7eb;padding:7px 10px;border-radius:6px}
  </style>
</head>
<body>
  <div class="stage">
    <div class="app">
      <aside class="sidebar"><div class="brand">TK观察工作台</div><div class="nav-label">工作台</div><div class="nav-item active">商务工作台</div><div class="nav-item">系统设置</div></aside>
      <section class="shell"><header class="header"><div class="menu">☰</div><div class="divider"></div><div class="title">商务工作台</div><div class="tools"><div class="search">⌘ K　全局搜索</div><span>◉</span><span>☼</span><div class="avatar">杨</div></div></header><main class="content"><h1>商务工作台</h1><p>维护达人关系、合作伙伴与合作推进状态。</p><div class="cards"><div class="card"><small>总客户数</small><strong>24</strong></div><div class="card"><small>进行中商机</small><strong>8</strong></div><div class="card"><small>预计成交金额</small><strong>$18,600</strong></div></div><div class="panel"><b>最近商机</b></div></main></section>
      <div class="greeting"><div class="sun">☀</div><div><div>早上好，打工人</div><div class="sub">今天也要稳稳推进</div></div></div>
      <div class="note">动画每 5 秒循环，仅用于预览；正式版登录后只播放一次</div>
    </div>
  </div>
</body>
</html>
